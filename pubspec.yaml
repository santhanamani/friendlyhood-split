name: friendlyhood_split
description: Friendlyhood Split - a modern group wallet and expense splitting app.
publish_to: none
version: 1.0.9+13

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_database: ^11.3.10
  google_sign_in: ^6.3.0
  intl: ^0.20.2
  uuid: ^4.5.1
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  record: ^7.1.1
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.3
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/wallet_hero_light.png
    - assets/branding/wallet_hero_dark.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/friendlyhood_logo.png
  adaptive_icon_background: "#07122F"
  adaptive_icon_foreground: assets/branding/friendlyhood_logo.png

flutter_native_splash:
  color: "#07122F"
  image: assets/branding/friendlyhood_logo.png
  android: true
  ios: false
  android_12:
    color: "#07122F"
    image: assets/branding/friendlyhood_logo.png
